# Serves the built React app; NPM (HTTPS) forwards politiscale.mi-fan.fr to http://politiscale:80
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker DNS, re-resolved at request time: nginx starts even if the API container is down
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api http://politiscale-api:3000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Hashed file names from Vite: cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Client-side routes (/Vote/Homer, /Bilan): always return index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
